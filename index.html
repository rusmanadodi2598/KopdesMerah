<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Kopdes 3D: Maju Desaku</title>
  <link rel="stylesheet" href="./css/style.css">
  <script type="importmap">
    { "imports": { "three": "./vendor/three.module.js" } }
  </script>
</head>
<body>
  <div id="app"></div>
  <div id="hud">
    <div class="hud-bar">
      <span id="hud-hari">Hari 1</span>
      <span id="hud-uang">Rp50.000</span>
    </div>
  </div>
  <div id="sentuh">
    <div id="joystick"><div id="stick"></div></div>
    <button id="btn-aksi" type="button">AKSI</button>
  </div>
  <div id="overlay" hidden></div>
  <div id="judul" hidden></div>
  <div id="bantuan" hidden></div>
  <div id="jeda" hidden></div>
  <div id="toast"></div>
  <div id="prompt" hidden></div>
  <div id="dialog" hidden></div>
  <div id="fade"></div>
  <div id="kartu-hari" hidden></div>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
